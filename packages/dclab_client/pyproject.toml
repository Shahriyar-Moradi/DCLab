[project]
name = "dclab-client"
dynamic = ["version"]
description = "Transport-neutral DCLab HTTP client for the stable /v1 API."
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2",
]

[project.scripts]
# Not `dclab`: the server repo's own distribution already owns that name
# (worker/user-seed), and both can live in one environment.
dclab-cli = "dclab_client.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dclab_client*"]

[tool.setuptools.dynamic]
version = {attr = "dclab_client._version.__version__"}
