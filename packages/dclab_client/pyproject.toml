[project]
name = "dclab-client"
version = "0.1.0"
description = "Transport-neutral DCLab HTTP client for the stable /v1 API."
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dclab_client*"]
