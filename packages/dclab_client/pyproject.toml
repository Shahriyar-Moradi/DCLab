[project]
name = "dclab-client"
dynamic = ["version"]
description = "Transport-neutral DCLab HTTP client for the stable /v1 API."
readme = "README.md"
requires-python = ">=3.12"
keywords = ["dclab", "machine-learning", "sdk", "cli"]
classifiers = [
  # No license classifier on purpose: the license is undecided (docs/adr/0011-open-source-license.md).
  # "Private :: Do Not Upload" makes PyPI refuse an accidental upload until it is decided.
  "Private :: Do Not Upload",
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2,<3",
]

[project.scripts]
# Not `dclab`: the server repo's own distribution already owns that name
# (worker/user-seed), and both can live in one environment.
dclab-cli = "dclab_client.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dclab_client*"]

[tool.setuptools.dynamic]
version = {attr = "dclab_client._version.__version__"}
