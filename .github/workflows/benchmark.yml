name: Benchmark

# R1-A: the pinned benchmark suite (scikit-learn bundled + OpenML tasks)
# through the open-ingest engine, checked against the accepted baseline in
# benchmarks/results/baseline.json. Weekly rather than nightly to keep
# Actions minutes low; run it on demand from the Actions tab before a release.
# Results are uploaded as an artifact; accepting a new baseline is a reviewed
# commit (`python -m benchmarks.harness.compare <run>.json --accept`).

on:
  schedule:
    - cron: "17 3 * * 1"  # Mondays 03:17 UTC
  workflow_dispatch:
    inputs:
      suite:
        description: "quick (bundled datasets) or full (adds OpenML)"
        default: full
        type: choice
        options: [quick, full]

concurrency:
  group: benchmark
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Never needs a database or secrets: the harness runs the engine directly.
      SCIKIT_LEARN_DATA: ${{ github.workspace }}/.sklearn-data
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install backend
        run: |
          pip install -r requirements.lock
          pip install -e . --no-deps

      - name: Cache OpenML datasets
        uses: actions/cache@v4
        with:
          path: .sklearn-data
          key: openml-${{ hashFiles('benchmarks/harness/tasks.py') }}

      - name: Run benchmark
        run: |
          python -m benchmarks.harness.run --suite "${{ inputs.suite || 'full' }}" --out benchmark-results.json

      - name: Compare with the accepted baseline
        if: always()
        run: python -m benchmarks.harness.compare benchmark-results.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: benchmark-results.json
