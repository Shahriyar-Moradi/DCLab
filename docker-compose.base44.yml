# Base44 development compose — runs the app from cloned source with live reload.
# Web (Next.js) is the public entry point on host port 3000.
# The API is internal-only; the web BFF proxies browser requests to it.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: decisionai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d decisionai"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: on-failure

  api:
    build:
      context: .
      dockerfile: Dockerfile.base44.api
    working_dir: /app
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/decisionai
      - CORS_ORIGINS=https://3000-${BASE44_PUBLIC_HOST_SUFFIX},http://localhost:3000
      - ML_JOB_DISPATCHER=thread
      - DCLAB_ENV=development
    command: ["uvicorn", "app.main:app", "--reload", "--app-dir", "apps/api", "--host", "0.0.0.0", "--port", "8001"]
    depends_on:
      postgres:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: on-failure

  web:
    image: node:22-slim
    working_dir: /app/apps/web
    volumes:
      - .:/app
      - web_node_modules:/app/apps/web/node_modules
    environment:
      - DCLAB_API_URL=http://api:8001
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
    command: ["sh", "-ec", "npm install && exec npx next dev -p 3001 -H 0.0.0.0"]
    ports:
      - "3000:3001"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3001/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    restart: on-failure

  init:
    build:
      context: .
      dockerfile: Dockerfile.base44.api
    working_dir: /app
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/decisionai
      - DCLAB_ENV=development
    command: ["sh", "-ec", "alembic upgrade head && dclab user seed"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  web_node_modules:
