# Future containerized stack — not required for local development.
# Day-to-day: native Postgres + `make run`.
# Start this later with: docker compose --profile docker up -d
# (Stop Homebrew Postgres first if it already owns port 5432.)

services:
  postgres:
    profiles: ["docker"]
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: decisionai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d decisionai"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    profiles: ["docker"]
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/decisionai
      CORS_ORIGINS: http://localhost:3001,http://127.0.0.1:3001
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
