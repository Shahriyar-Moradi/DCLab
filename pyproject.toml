[project]
name = "decision-ai"
version = "0.2.0"
description = "DCLab — decision layer (M1) plus real-data experimentation platform v0.1"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116",
  "uvicorn[standard]>=0.35",
  "sqlalchemy>=2.0",
  "psycopg2-binary>=2.9",
  "alembic>=1.13",
  "pydantic-settings>=2.10",
  "pandas>=2.2",
  "pyarrow>=15",
  "scikit-learn>=1.5",
  "joblib>=1.4",
  "pyyaml>=6.0",
  "python-multipart>=0.0.9",
  "pyjwt>=2.9",
  "bcrypt>=4.2",
  "pytest>=8.0",
  "httpx>=0.27",
  "pytest-cov>=5.0",
  "python-docx>=1.1",
  "openai>=3.6,<4",
]

[project.optional-dependencies]
boosting = ["xgboost>=2.0", "lightgbm>=4.0", "catboost>=1.2"]

[project.scripts]
dclab = "app.cli.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "apps/api" }

[tool.setuptools.packages.find]
where = ["apps/api"]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests"]
pythonpath = [".", "apps/api", "apps/api/tests"]
