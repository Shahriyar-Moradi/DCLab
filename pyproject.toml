[project]
name = "decision-ai"
version = "0.2.0"
description = "DCLab — decision layer (M1) plus real-data experimentation platform v0.1"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35",
  # SQLAlchemy 2.1 maps plain postgresql:// URLs to psycopg (v3); keep the two
  # pinned together so local dev and CI resolve the same driver.
  "sqlalchemy>=2.1,<2.2",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.13,<2",
  "pydantic-settings>=2.10,<3",
  "pandas>=2.2,<4",
  "numpy>=1.26,<3",
  "pyarrow>=15,<30",
  "scikit-learn>=1.5,<2",
  "joblib>=1.4",
  "pyyaml>=6.0",
  "python-multipart>=0.0.9",
  "pyjwt>=2.9,<3",
  "bcrypt>=4.2,<6",
  "httpx>=0.27",
  "python-docx>=1.1",
  "openai>=3.6,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "pytest-xdist>=3.6"]
# xgboost-cpu (Linux/Windows) is the official CPU-only build: ~6 MB instead of
# ~360 MB with the NVIDIA NCCL GPU library. DCLab trains on CPU; macOS wheels
# never include NCCL, so plain xgboost is used there. Both import as `xgboost`.
boosting = [
  "xgboost>=2.0,<4; sys_platform == 'darwin'",
  "xgboost-cpu>=2.0,<4; sys_platform != 'darwin'",
  "lightgbm>=4.0,<5",
  "catboost>=1.2,<2",
]
# Bounded inner-CV hyperparameter tuning (P1.4-C); without it tuning is skipped.
tuning = ["optuna>=4,<5"]
storage-s3 = ["boto3>=1.34"]
storage-gcs = ["google-cloud-storage>=2.14"]
# Official MCP Python SDK for packages/dclab_mcp (P3.4-A), pinned exactly. Locked in
# requirements-mcp.lock (`make lock-mcp`), never in requirements.lock (API/worker images).
mcp = ["mcp==2.2.0"]
# AI provider SDKs (ADR 0009 §9), imported only under app/agents/gateway/providers/.
# Locked in requirements-agents.lock (`make lock-agents`), never in requirements.lock
# (API/worker images). Every test runs without it (fake Jev). nooa==0.0.10 is not
# here yet: it needs litellm, whose openai<3 pin conflicts with openai>=3.6 above.
agents = ["typesafe-sdk==0.7.2"]
storage = [
  "boto3>=1.34",
  "google-cloud-storage>=2.14",
]

[project.scripts]
dclab = "app.cli.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "apps/api" }

[tool.setuptools.packages.find]
where = ["apps/api"]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "packages/dclab_client/tests", "packages/dclab_mcp/tests"]
pythonpath = [".", "apps/api", "apps/api/tests", "packages/dclab_client", "packages/dclab_mcp"]
